<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Label Designer</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
  }
}
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="sidebar">
  <h1>3D Label Designer</h1>

  <div class="section">
    <div class="section-title">Dimensions</div>
    <div class="row2">
      <div class="field">
        <label for="length">Length (mm)</label>
        <input type="number" id="length" value="100" min="1" max="500" step="1">
      </div>
      <div class="field">
        <label for="width">Width (mm)</label>
        <input type="number" id="width" value="50" min="1" max="500" step="1">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label for="radius">Corner Radius (mm)</label>
        <input type="number" id="radius" value="5" min="0" max="100" step="0.5">
      </div>
      <div class="field">
        <label for="thickness">Thickness (mm)</label>
        <input type="number" id="thickness" value="5" min="0.5" max="50" step="0.5">
      </div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="section">
    <div class="section-title">Text</div>
    <div class="field">
      <label for="text">Label Text</label>
      <input type="text" id="text" value="Hello World" placeholder="Enter text…">
    </div>
    <div class="field">
      <label for="font">Font Style</label>
      <select id="font"></select>
    </div>
    <div class="row2">
      <div class="field">
        <label for="fontSize">Size (mm)</label>
        <input type="number" id="fontSize" value="8" min="1" max="100" step="0.5">
      </div>
      <div class="field">
        <label for="raise">Raise (mm)</label>
        <input type="number" id="raise" value="1.5" min="0.1" max="20" step="0.1">
      </div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="section">
    <div class="section-title">Colors</div>
    <div class="row2">
      <div class="field">
        <label>Plate Color</label>
        <div class="color-row">
          <input type="color" id="plateColor" value="#2255aa">
          <input type="text" class="color-hex" id="plateColorHex" value="#2255aa" maxlength="7" spellcheck="false">
        </div>
      </div>
      <div class="field">
        <label>Text Color</label>
        <div class="color-row">
          <input type="color" id="textColor" value="#f5c842">
          <input type="text" class="color-hex" id="textColorHex" value="#f5c842" maxlength="7" spellcheck="false">
        </div>
      </div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="section">
    <div class="section-title">Export</div>
    <div class="row2">
      <button class="btn btn-primary" id="btnSTL">⬇ STL</button>
      <button class="btn btn-secondary" id="btn3MFMulti">⬇ 3MF</button>
    </div>
    <p class="hint">STL &amp; 3MF — ideal for 3D printing. 3MF includes plate and text as separate parts for multi-filament printers.</p>
  </div>

  <div class="divider"></div>

  <div class="section">
    <div class="btn-row">
      <button class="btn btn-secondary" id="btnResetCamera">⟳ Reset Camera</button>
    </div>
  </div>
</div>

<div id="canvas-container">
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text">Loading fonts…</div>
  </div>
  <div id="info-bar">Drag to rotate · Scroll to zoom · Right-drag to pan</div>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
